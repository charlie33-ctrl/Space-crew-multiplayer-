</style></head><body>
<section id="name" class="screen on"><div class="card"><h1>SPACE CREW</h1><p>Multiplayer ship build</p><input id="nameIn" maxlength="14" placeholder="Player name"><button id="cont" class="primary" style="width:100%;margin-top:10px">Continue</button></div></section>
<section id="menu" class="screen"><div class="card"><h2>Hop In</h2><div class="grid two"><button id="host" class="primary">Host Game</button><button id="join">Join Game</button></div><div id="joinBox" class="hide" style="margin-top:10px"><input id="roomIn" maxlength="6" placeholder="ROOM CODE"><button id="joinGo" class="primary" style="width:100%;margin-top:8px">Join Room</button></div><p id="err" class="small"></p></div></section>
<section id="lobby" class="screen"><div class="card"><div class="small">ROOM CODE</div><div id="roomCode" class="code">------</div><h3>Players</h3><div id="players"></div><h3>Customize</h3><div class="grid two"><label>Color<select id="color"><option value="#d94b50">Red</option><option value="#3978d6">Blue</option><option value="#4fa65f">Green</option><option value="#d7b33d">Yellow</option><option value="#9560c4">Purple</option></select></label><label>Hat<select id="hat"><option value="none">None</option><option value="crown">Crown</option><option value="tophat">Top Hat</option><option value="cap">Cap</option><option value="cowboy">Cowboy Hat</option><option value="beanie">Beanie</option><option value="hardhat">Hard Hat</option><option value="wizard">Wizard Hat</option><option value="sprout">Sprout</option></select></label><label>Pet<select id="pet"><option value="none">None</option><option value="dog">Dog</option><option value="cat">Cat</option><option value="robot">Mini Robot</option><option value="blob">Alien Blob</option><option value="chick">Chick</option><option value="buddy">Mini Buddy</option></select></label><label>Difficulty<select id="diff"><option>Easy</option><option selected>Medium</option><option>Hard</option><option>Insane</option></select></label></div><div id="hostSettings"><h3>Host Settings</h3><div class="grid two"><label>Voting Time<input id="voteTime" type="number" min="10" max="180" value="45"></label><label>Impostors<input id="imps" type="number" min="1" max="3" value="1"></label><label>Engineers<input id="eng" type="number" min="0" value="0"></label><label>Scientists<input id="sci" type="number" min="0" value="0"></label><label>Judges<input id="jud" type="number" min="0" value="0"></label><label>Defenders<input id="def" type="number" min="0" value="0"></label></div><button id="start" class="primary" style="width:100%;margin-top:14px">Start Game</button></div><p id="lerr" class="small"></p></div></section>
<section id="game" class="screen"><div class="hud"><b id="role">CREWMATE</b><div class="bar"><i id="fill"></i></div><span id="prog">0/0</span></div><canvas id="cv" width="960" height="540"></canvas><div class="bottom"><div id="joy" class="joy"><div id="stick" class="stick"></div></div><div class="actions"><button id="task" class="hide">USE TASK</button><button id="vent" class="hide">VENT</button><button id="report" class="red hide">REPORT</button><button id="meet" class="red hide">EMERGENCY</button><button id="kill" class="red hide">KILL</button></div></div><p id="status" class="small" style="max-width:1100px;margin:8px auto">Connected.</p></section>
<div id="reveal" class="overlay hide"><div style="text-align:center"><canvas id="rc" width="180" height="180" style="border:0"></canvas><h1 id="rr"></h1><p id="rt" class="small"></p></div></div>

<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=s=>document.querySelector(s),screens=['name','menu','lobby','game'];
const rooms=[['REACTOR',120,420,430,430],['ENGINE',610,160,470,360],['MED BAY',640,650,420,340],['CAFETERIA',1160,480,650,520],['WEAPONS',1930,250,430,340],['NAVIGATION',2520,520,450,500],['ADMIN',1910,800,430,330],['ELECTRICAL',1050,1190,430,350],['STORAGE',1570,1280,650,480],['SECURITY',480,1050,400,330],['LOWER ENGINE',520,1540,500,370],['SHIELDS',2350,1320,450,350]],corr=[[250,590,2750,170],[760,280,170,1500],[1380,650,170,800],[2010,370,170,1100],[650,1290,1900,180]],props=[[1540,1400,55,48],[1610,1400,55,48],[1690,1400,65,50],[1880,1580,60,50],[1970,1580,65,50],[1300,560,100,50],[1500,560,100,50],[730,410,120,70],[680,1670,125,75],[2290,1460,55,90],[2390,1460,55,90]],tasks=[[300,610],[790,310],[790,810],[1370,640],[1610,820],[2070,400],[2740,760],[2080,930],[1240,1350],[1770,1480],[700,1200],[760,1710],[2530,1460],[2450,1570]],vents=[[355,700],[850,430],[890,850],[1320,850],[1700,650],[2110,500],[2710,850],[2070,1000],[1180,1360],[1810,1570],[710,1230],[820,1720],[2530,1510]],em=[1480,735];
const taskNames=['CIRCUIT WIRING','DATA TRANSFER','VENT MAINTENANCE','TRASH SORTER','SIGNAL SEQUENCE','POWER ROUTING','CALIBRATION'];
const S={name:'Player',room:null,id:null,host:false,role:null,players:new Map(),x:1450,y:760,color:'#d94b50',hat:'none',pet:'none',dead:false,taskDone:0,totalTasks:0,assignments:[],bodies:[],judgeUsed:false,settings:{difficulty:'Medium'},activeTask:-1};
function show(x){screens.forEach(s=>$('#'+s).classList.toggle('on',s===x))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
socket.on('connect',()=>S.id=socket.id);socket.on('errorMsg',m=>{$('#err').textContent=m;$('#lerr').textContent=m;$('#status').textContent=m});
$('#cont').onclick=()=>{S.name=$('#nameIn').value.trim()||'Player';show('menu')};$('#join').onclick=()=>$('#joinBox').classList.toggle('hide');function profile(){return{name:S.name,color:$('#color')?.value||S.color,hat:$('#hat')?.value||S.hat,pet:$('#pet')?.value||S.pet}}
$('#host').onclick=()=>{S.host=true;socket.emit('host',profile())};$('#joinGo').onclick=()=>{S.host=false;socket.emit('join',{...profile(),code:$('#roomIn').value.trim().toUpperCase()})};
socket.on('room',r=>{S.room=r.code;S.settings=r.settings||S.settings;S.players=new Map(r.players.map(p=>[p.id,p]));S.bodies=r.bodies||[];const me=S.players.get(S.id);if(me){S.x=me.x;S.y=me.y;S.dead=me.alive===false;S.taskDone=me.done||0}$('#roomCode').textContent=r.code;$('#players').innerHTML=r.players.map(p=>`<div class="player"><b>${esc(p.name)}</b>${p.id===r.host?' · HOST':''}${p.alive===false?' · GHOST':''}</div>`).join('');S.host=r.host===S.id;$('#hostSettings').classList.toggle('hide',!S.host);if(!r.started)show('lobby');progress()});
function settings(){return{difficulty:$('#diff').value,voteTime:+$('#voteTime').value,impostors:+$('#imps').value,engineers:+$('#eng').value,scientists:+$('#sci').value,judges:+$('#jud').value,defenders:+$('#def').value}};['diff','voteTime','imps','eng','sci','jud','def'].forEach(id=>$('#'+id).onchange=()=>S.host&&socket.emit('settings',settings()));$('#start').onclick=()=>socket.emit('start');
socket.on('role',d=>{S.role=d.role;S.assignments=d.assignments||[];S.settings=d.settings||S.settings;S.judgeUsed=false});socket.on('assignments',d=>S.assignments=d.assignments||[]);socket.on('started',d=>{S.settings=d.settings||S.settings;S.dead=false;S.taskDone=0;$('#role').textContent=(S.role||'CREWMATE').toUpperCase();show('game');$('#rr').textContent=(S.role||'Crewmate').toUpperCase();$('#rt').textContent=S.role==='Impostor'?'Blend in. Use vents and eliminate the crew.':'Complete your assigned tasks and watch the crew.';$('#reveal').classList.remove('hide');drawCrew($('#rc').getContext('2d'),90,100,$('#color').value,$('#hat').value,1.4);setTimeout(()=>$('#reveal').classList.add('hide'),2600)});
socket.on('moved',d=>{let p=S.players.get(d.id);if(p)Object.assign(p,d)});socket.on('vented',d=>{S.x=d.x;S.y=d.y});socket.on('killed',d=>{let p=S.players.get(d.id);if(p)p.alive=false;if(d.body&&!S.bodies.some(b=>b.id===d.body.id))S.bodies.push(d.body);if(d.id===S.id){S.dead=true;$('#status').textContent='You were eliminated. You are a ghost and can phase through walls.'}});socket.on('taskProgress',d=>{let p=S.players.get(d.id);if(p)p.done=d.done;if(d.id===S.id)S.taskDone=d.done;S.totalTasks=d.total;progress()});
const C=$('#cv'),X=C.getContext('2d');let keys={},joy={x:0,y:0},last=0;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);const J=$('#joy'),ST=$('#stick');function jm(e){let r=J.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y),q=30;if(m>q){x=x/m*q;y=y/m*q}joy={x:x/q,y:y/q};ST.style.transform=`translate(${x}px,${y}px)`}J.onpointerdown=e=>{J.setPointerCapture(e.pointerId);jm(e)};J.onpointermove=e=>J.hasPointerCapture(e.pointerId)&&jm(e);J.onpointerup=()=>{joy={x:0,y:0};ST.style.transform=''};
function inside(x,y,r,m=0){return x>r[0]-m&&x<r[0]+r[2]+m&&y>r[1]-m&&y<r[1]+r[3]+m}function floor(x,y){return rooms.some(a=>inside(x,y,[a[1]+18,a[2]+18,a[3]-36,a[4]-36]))||corr.some(a=>inside(x,y,[a[0]+18,a[1]+18,a[2]-36,a[3]-36]))}function walkable(x,y){return floor(x,y)&&!props.some(r=>inside(x,y,r,22))}
function loop(t){if($('#game').classList.contains('on')&&$('#meeting').classList.contains('hide')&&$('#taskModal').classList.contains('hide')){let dt=Math.min(2,(t-last)/16.7||1),dx=joy.x+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),dy=joy.y+(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0),m=Math.hypot(dx,dy);if(m){dx/=m;dy/=m;let nx=S.x+dx*4*dt,ny=S.y+dy*4*dt;if(S.dead||walkable(nx,S.y))S.x=nx;if(S.dead||walkable(S.x,ny))S.y=ny;socket.emit('move',{x:S.x,y:S.y,color:$('#color').value,hat:$('#hat').value,pet:$('#pet').value})}}last=t;draw(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill();c.stroke()}function draw(t){X.clearRect(0,0,960,540);let camX=S.x-480,camY=S.y-270;X.save();X.translate(-camX,-camY);X.fillStyle='#060a11';X.fillRect(0,0,3100,2100);for(const [name,x,y,w,h] of rooms){X.fillStyle='#172231';X.strokeStyle='#3b4b62';X.lineWidth=10;rr(X,x,y,w,h,26);X.fillStyle='#9aaabd';X.font='bold 20px system-ui';X.textAlign='center';X.fillText(name,x+w/2,y+34)}for(const [x,y,w,h] of corr){X.fillStyle='#202d3c';X.strokeStyle='#34465b';X.lineWidth=4;rr(X,x,y,w,h,18)}for(const [x,y,w,h] of props){X.fillStyle='#364658';X.strokeStyle='#607287';X.lineWidth=4;rr(X,x,y,w,h,7);X.strokeStyle='#212b37';X.beginPath();X.moveTo(x+8,y+8);X.lineTo(x+w-8,y+h-8);X.moveTo(x+w-8,y+8);X.lineTo(x+8,y+h-8);X.stroke()}let pulse=(Math.sin(t/320)+1)/2;tasks.forEach((p,i)=>{if(S.role!=='Impostor'&&S.assignments.includes(i)){X.strokeStyle=`rgba(242,213,107,${.35+.45*pulse})`;X.lineWidth=5;X.beginPath();X.arc(p[0],p[1],34+5*pulse,0,Math.PI*2);X.stroke()}X.fillStyle='#526174';X.strokeStyle='#8492a4';X.lineWidth=3;rr(X,p[0]-22,p[1]-18,44,36,6);X.fillStyle='#9fe8ee';X.fillRect(p[0]-12,p[1]-9,24,12)});vents.forEach(p=>{if((S.role==='Impostor'||S.role==='Engineer')&&!S.dead){X.strokeStyle=`rgba(220,70,70,${.35+.45*pulse})`;X.lineWidth=5;X.beginPath();X.arc(p[0],p[1],31+4*pulse,0,Math.PI*2);X.stroke()}X.fillStyle='#252d36';X.strokeStyle='#657181';X.lineWidth=3;rr(X,p[0]-25,p[1]-14,50,28,5);X.strokeStyle='#8994a3';for(let k=-15;k<=15;k+=10){X.beginPath();X.moveTo(p[0]+k,p[1]-9);X.lineTo(p[0]+k,p[1]+9);X.stroke()}});X.fillStyle='#6d3540';X.strokeStyle='#a4636f';X.lineWidth=4;rr(X,em[0]-45,em[1]-28,90,56,18);X.fillStyle='#fff';X.font='bold 11px system-ui';X.fillText('EMERGENCY',em[0],em[1]+4);S.bodies.filter(b=>!b.reported).forEach(drawBody);for(const p of S.players.values()){let x=p.id===S.id?S.x:p.x,y=p.id===S.id?S.y:p.y;if(p.alive!==false||S.dead){X.globalAlpha=p.alive===false?.38:1;drawCrew(X,x,y,p.color||'#777',p.hat||'none',1);drawPet(X,x-42,y+28,p.pet||'none',t);X.globalAlpha=1;X.fillStyle='#fff';X.font='bold 14px system-ui';X.textAlign='center';X.fillText(p.name,x,y-48)}}X.restore();nearButtons()}
function drawCrew(c,x,y,col,hat,sc){c.save();c.translate(x,y);c.scale(sc,sc);c.fillStyle=col;c.strokeStyle='#202733';c.lineWidth=4;c.beginPath();c.roundRect(-25,-31,50,64,18);c.fill();c.stroke();c.fillStyle='#aee8f5';c.beginPath();c.roundRect(-9,-20,28,18,8);c.fill();c.stroke();c.fillStyle=col;c.fillRect(-31,-12,10,31);c.fillRect(-18,26,13,18);c.fillRect(7,26,13,18);drawHat(c,hat);c.restore()}
function drawHat(c,h){if(h==='none')return;c.save();if(h==='crown'){c.fillStyle='#e8c64a';c.beginPath();c.moveTo(-22,-31);c.lineTo(-18,-55);c.lineTo(-6,-42);c.lineTo(2,-60);c.lineTo(12,-42);c.lineTo(23,-55);c.lineTo(20,-30);c.closePath();c.fill()}else if(h==='tophat'){c.fillStyle='#20242d';c.fillRect(-25,-34,50,7);c.beginPath();c.roundRect(-16,-58,32,28,5);c.fill()}else if(h==='cap'){c.fillStyle='#4d77c7';c.beginPath();c.arc(0,-35,18,Math.PI,0);c.fill();c.fillRect(-2,-36,28,6)}else if(h==='cowboy'){c.fillStyle='#b8864e';c.beginPath();c.ellipse(0,-33,30,7,0,0,7);c.fill();c.beginPath();c.roundRect(-15,-52,30,20,8);c.fill()}else if(h==='beanie'){c.fillStyle='#a65aa6';c.beginPath();c.arc(0,-34,19,Math.PI,0);c.fill();c.beginPath();c.arc(0,-54,5,0,7);c.fill()}else if(h==='hardhat'){c.fillStyle='#e6b72e';c.beginPath();c.arc(0,-35,20,Math.PI,0);c.fill();c.fillRect(-25,-36,50,6)}else if(h==='wizard'){c.fillStyle='#6847a8';c.beginPath();c.moveTo(-20,-32);c.lineTo(4,-68);c.lineTo(18,-32);c.fill();c.fillRect(-25,-34,50,6)}else if(h==='sprout'){c.strokeStyle='#4c9b54';c.lineWidth=4;c.beginPath();c.moveTo(0,-31);c.lineTo(0,-52);c.stroke();c.fillStyle='#62b568';c.beginPath();c.ellipse(-7,-52,9,5,-.5,0,7);c.ellipse(7,-48,9,5,.5,0,7);c.fill()}c.restore()}

function drawBody(b){X.fillStyle=b.color;X.strokeStyle='#202733';X.lineWidth=4;X.beginPath();X.roundRect(b.x-25,b.y,50,28,9);X.fill();X.stroke();X.fillRect(b.x-19,b.y+20,15,16);X.fillRect(b.x+5,b.y+20,15,16);X.fillStyle='#eee9db';X.fillRect(b.x-5,b.y-24,10,27);X.beginPath();X.arc(b.x,b.y-25,8,0,Math.PI*2);X.fill()}
function nearestTask(){let best=-1,bd=1e9;S.assignments.forEach(i=>{let p=tasks[i],d=Math.hypot(S.x-p[0],S.y-p[1]);if(d<bd){bd=d;best=i}});return bd<82?best:-1}function nearestVent(){let best=-1,bd=1e9;vents.forEach((p,i)=>{let d=Math.hypot(S.x-p[0],S.y-p[1]);if(d<bd){bd=d;best=i}});return bd<82?best:-1}function nearestBody(){return S.bodies.filter(b=>!b.reported).sort((a,b)=>Math.hypot(S.x-a.x,S.y-a.y)-Math.hypot(S.x-b.x,S.y-b.y))[0]}function nearestVictim(){return [...S.players.values()].filter(p=>p.id!==S.id&&p.alive!==false).sort((a,b)=>Math.hypot(S.x-a.x,S.y-a.y)-Math.hypot(S.x-b.x,S.y-b.y))[0]}
function nearButtons(){let ti=nearestTask(),vi=nearestVent(),body=nearestBody(),victim=nearestVictim(),bd=body?Math.hypot(S.x-body.x,S.y-body.y):999,vd=victim?Math.hypot(S.x-victim.x,S.y-victim.y):999;$('#task').classList.toggle('hide',S.dead||S.role==='Impostor'||ti<0);$('#vent').classList.toggle('hide',S.dead||!(S.role==='Impostor'||S.role==='Engineer')||vi<0);$('#report').classList.toggle('hide',S.dead||!body||bd>90);$('#meet').classList.toggle('hide',S.dead||Math.hypot(S.x-em[0],S.y-em[1])>105);$('#kill').classList.toggle('hide',S.dead||S.role!=='Impostor'||!victim||vd>105)}
$('#kill').onclick=()=>{let n=nearestVictim();if(n&&Math.hypot(S.x-n.x,S.y-n.y)<=105)socket.emit('kill',n.id)};$('#vent').onclick=()=>{let i=nearestVent();if(i>=0)socket.emit('vent',i)};$('#report').onclick=()=>{let b=nearestBody();if(b&&Math.hypot(S.x-b.x,S.y-b.y)<=90)socket.emit('report',b.id)};$('#meet').onclick=()=>socket.emit('meeting');
let taskTimer=null;$('#task').onclick=()=>{let i=nearestTask();if(i>=0)openTask(i)};$('#taskClose').onclick=()=>{clearInterval(taskTimer);$('#taskModal').classList.add('hide')};
function startClock(rebuild){clearInterval(taskTimer);const diff=S.settings.difficulty||$('#diff').value,seconds={Easy:38,Medium:27,Hard:18,Insane:11}[diff],end=Date.now()+seconds*1000;taskTimer=setInterval(()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));$('#timer').textContent='TIME '+left+'s';if(!left){clearInterval(taskTimer);$('#taskMsg').textContent='Time up — entire task reset.';setTimeout(rebuild,500)}},150)}function fail(rebuild,msg='Mistake — entire task reset.'){clearInterval(taskTimer);$('#taskMsg').textContent=msg;setTimeout(rebuild,500)}function finishTask(i){clearInterval(taskTimer);$('#taskModal').classList.add('hide');socket.emit('taskDone',i);$('#status').textContent='Task complete.'}
function openTask(i){S.activeTask=i;$('#taskModal').classList.remove('hide');const type=i%7,diff=S.settings.difficulty||$('#diff').value,level={Easy:0,Medium:1,Hard:2,Insane:3}[diff];function build(){$('#taskMsg').textContent=diff+' difficulty — any mistake or timeout resets the whole task.';$('#taskTitle').textContent=taskNames[type];if(type===0){let n=[3,4,5,6][level],order=Array.from({length:n},(_,x)=>x),need=0;$('#taskBody').innerHTML='<p>Connect matching cable numbers from left to right in order.</p><div id="wire"></div>';for(let k=0;k<n;k++){let row=document.createElement('div');row.className='wireRow';let a=document.createElement('button'),b=document.createElement('button');a.className=b.className='wireBtn';a.textContent='Cable '+(k+1);b.textContent='Socket '+(k+1);a.onclick=()=>{if(k!==need)return fail(build);a.disabled=true;b.disabled=false};b.disabled=true;b.onclick=()=>{if(k!==need)return fail(build);b.disabled=true;if(++need===n)finishTask(i)};row.append(a,b);$('#wire').appendChild(row)}}else if(type===1){$('#taskBody').innerHTML='<p>Hold TRANSFER until the data reaches 100%. Releasing early resets it.</p><div class="meter"><i id="dataBar"></i></div><button id="transfer" style="width:100%;margin-top:12px">HOLD TRANSFER</button>';let pct=0,iv=null,b=$('#transfer');const stop=ok=>{clearInterval(iv);iv=null;if(!ok&&pct<100)fail(build,'Transfer interrupted — whole task reset.')};b.onpointerdown=e=>{e.preventDefault();if(iv)return;iv=setInterval(()=>{pct+=2+[0,0,1,1][level];$('#dataBar').style.width=Math.min(100,pct)+'%';if(pct>=100){stop(true);finishTask(i)}},80)};b.onpointerup=()=>stop(false);b.onpointercancel=()=>stop(false);b.onpointerleave=e=>{if(e.buttons)stop(false)}}else if(type===2){let debris=[4,6,8,10][level],good=0;$('#taskBody').innerHTML='<p>Clear every obstruction from the vent. Tap the pieces in numerical order.</p><div class="trash" id="ventDebris"></div>';let arr=Array.from({length:debris},(_,x)=>x).sort(()=>Math.random()-.5);arr.forEach(n=>{let b=document.createElement('button');b.textContent='Debris '+(n+1);b.onclick=()=>{if(n!==good)return fail(build);b.disabled=true;if(++good===debris)finishTask(i)};$('#ventDebris').appendChild(b)})}else if(type===3){let bins=['METAL','PLASTIC','ORGANIC'],count=[5,7,9,12][level],step=0,items=Array.from({length:count},()=>bins[Math.floor(Math.random()*3)]);$('#taskBody').innerHTML='<p id="trashItem"></p><div class="trash" id="bins"></div>';bins.forEach(bin=>{let b=document.createElement('button');b.textContent=bin;b.onclick=()=>{if(bin!==items[step])return fail(build);step++;if(step===items.length)return finishTask(i);$('#trashItem').textContent='Sort item: '+items[step]};$('#bins').appendChild(b)});$('#trashItem').textContent='Sort item: '+items[0]}else{let len=[4,6,8,11][level],buttons=type===4?4:6,seq=Array.from({length:len},()=>Math.floor(Math.random()*buttons)),step=0;$('#taskBody').innerHTML='<p>Repeat the displayed sequence exactly.</p><p class="code" style="font-size:18px">'+seq.map(x=>x+1).join(' → ')+'</p><div class="votes" id="mods"></div>';for(let n=0;n<buttons;n++){let b=document.createElement('button');b.textContent=(type===6?'CAL ':'NODE ')+(n+1);b.onclick=()=>{if(n!==seq[step])return fail(build);if(++step===seq.length)finishTask(i)};$('#mods').appendChild(b)}}startClock(build)}build()}
function progress(){let total=S.totalTasks||[...S.players.values()].length*7,done=[...S.players.values()].reduce((a,p)=>a+(p.done||0),0);$('#fill').style.width=(total?done/total*100:0)+'%';$('#prog').textContent=done+'/'+total}
socket.on('meeting',m=>{S.bodies.forEach(b=>b.reported=true);$('#meeting').classList.remove('hide');$('#reason').textContent=m.reason;$('#votes').innerHTML='';$('#vstatus').textContent='';$('#vmsg').textContent=S.role==='Judge'&&!S.judgeUsed?'Vote normally, or double-tap a player to use your one judgment.':'';m.players.forEach(p=>{if(p.id===S.id)return;let b=document.createElement('button');b.textContent=p.name;b.onclick=()=>vote(p.id);let lastTap=0;b.ontouchend=e=>{let now=Date.now();if(now-lastTap<330&&S.role==='Judge'&&!S.judgeUsed){e.preventDefault();S.judgeUsed=true;socket.emit('judge',p.id)}lastTap=now};b.ondblclick=()=>{if(S.role==='Judge'&&!S.judgeUsed){S.judgeUsed=true;socket.emit('judge',p.id)}};$('#votes').appendChild(b)});let iv=setInterval(()=>{if($('#meeting').classList.contains('hide'))return clearInterval(iv);$('#mtimer').textContent=Math.max(0,Math.ceil((m.ends-Date.now())/1000))+'s'},200)});function vote(id){socket.emit('vote',id);$('#votes').querySelectorAll('button').forEach(b=>b.disabled=true);$('#skip').disabled=true}$('#skip').onclick=()=>vote(null);socket.on('voted',d=>{$('#vstatus').textContent+=' ✓ '+(S.players.get(d.id)?.name||'Player')});socket.on('hammer',d=>{let p=S.players.get(d.target),h=document.createElement('div');h.className='hammer';h.style.left='50%';h.style.top='18%';document.body.appendChild(h);setTimeout(()=>h.remove(),800)});socket.on('judgeResult',d=>{$('#vmsg').textContent=d.text;if(d.dead===S.id)S.dead=true});socket.on('voteResult',d=>{$('#vmsg').innerHTML=d.votes.map(v=>`<b>${esc(v.voter)}</b> → ${esc(v.target)}`).join('<br>')+'<hr>'+(d.ejected?esc(d.ejected)+' was ejected.':'Nobody was ejected.');setTimeout(()=>$('#meeting').classList.add('hide'),3000)});socket.on('victory',d=>{$('#meeting').classList.add('hide');$('#taskModal').classList.add('hide');$('#victory').classList.remove('hide');$('#vtitle').textContent=d.title;$('#vtext').textContent=d.text;setTimeout(()=>{$('#victory').classList.add('hide');show('lobby')},3300)});
</script></body></html>
