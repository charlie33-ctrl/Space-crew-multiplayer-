<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Space Crew Multiplayer</title><style>
*{box-sizing:border-box}body{margin:0;background:#050912;color:#f4f7fb;font-family:system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{border:1px solid #52617a;background:#1c2738;color:#fff;border-radius:12px;padding:12px 16px;font-weight:800}.primary{background:#315f9d}.red{background:#843441}.screen{display:none;min-height:100vh;padding:16px}.on{display:block}.card{max-width:760px;margin:5vh auto;background:#111a28;border:1px solid #34445d;border-radius:22px;padding:20px}.grid{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}input,select{width:100%;padding:11px;background:#0b1220;color:white;border:1px solid #3c4b62;border-radius:10px}.code{font-size:30px;font-weight:900;letter-spacing:.14em}.player{padding:9px;border-bottom:1px solid #26364b}.small{font-size:13px;color:#aab6c8}.hide{display:none!important}.hud{max-width:1100px;margin:auto;display:flex;gap:9px;align-items:center}.bar{height:14px;flex:1;background:#263142;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#6d9e69;width:0}canvas{display:block;width:100%;max-width:1100px;aspect-ratio:16/9;margin:8px auto;border:1px solid #34445d;border-radius:14px;background:#070b12;touch-action:none}.bottom{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:end}.joy{width:104px;height:104px;border-radius:50%;border:2px solid #52617a;background:#172131;position:relative;touch-action:none}.stick{width:42px;height:42px;border-radius:50%;background:#71809a;position:absolute;left:29px;top:29px}.actions{display:grid;gap:7px}.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#152033;border:2px solid #5b6c86;border-radius:20px;padding:18px}.votes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.hammer{position:fixed;font-size:70px;z-index:50;animation:slam .7s ease-in}@keyframes slam{0%{transform:translateY(-80px) rotate(-35deg)}70%{transform:translateY(0) rotate(20deg)}100%{opacity:0}}@media(max-width:600px){.two,.votes{grid-template-columns:1fr}.card{margin:1vh auto}}
</style></head><body>
<section id="name" class="screen on"><div class="card"><h1>SPACE CREW</h1><p>Multiplayer build</p><input id="nameIn" maxlength="14" placeholder="Player name"><button id="cont" class="primary" style="width:100%;margin-top:10px">Continue</button></div></section>
<section id="menu" class="screen"><div class="card"><h2>Hop In</h2><div class="grid two"><button id="host" class="primary">Host Game</button><button id="join">Join Game</button></div><div id="joinBox" class="hide" style="margin-top:10px"><input id="roomIn" maxlength="6" placeholder="ROOM CODE"><button id="joinGo" class="primary" style="width:100%;margin-top:8px">Join Room</button></div><p id="err" class="small"></p></div></section>
<section id="lobby" class="screen"><div class="card"><div class="small">ROOM CODE</div><div id="roomCode" class="code">------</div><h3>Players</h3><div id="players"></div><h3>Customize</h3><div class="grid two"><label>Color<select id="color"><option value="#d94b50">Red</option><option value="#3978d6">Blue</option><option value="#4fa65f">Green</option><option value="#d7b33d">Yellow</option><option value="#9560c4">Purple</option></select></label><label>Hat<select id="hat"><option value="none">None</option><option value="crown">Crown</option><option value="tophat">Top Hat</option><option value="cap">Cap</option><option value="cowboy">Cowboy Hat</option><option value="beanie">Beanie</option><option value="hardhat">Hard Hat</option><option value="wizard">Wizard Hat</option><option value="sprout">Sprout</option></select></label><label>Pet<select id="pet"><option value="none">None</option><option value="dog">Dog</option><option value="cat">Cat</option><option value="robot">Mini Robot</option><option value="blob">Alien Blob</option><option value="chick">Chick</option><option value="buddy">Mini Buddy</option></select></label><label>Difficulty<select id="diff"><option>Easy</option><option selected>Medium</option><option>Hard</option><option>Insane</option></select></label></div><div id="hostSettings"><h3>Host Settings</h3><div class="grid two"><label>Voting Time<input id="voteTime" type="number" min="10" max="180" value="45"></label><label>Impostors<input id="imps" type="number" min="1" max="3" value="1"></label><label>Engineers<input id="eng" type="number" min="0" value="0"></label><label>Scientists<input id="sci" type="number" min="0" value="0"></label><label>Judges<input id="jud" type="number" min="0" value="0"></label><label>Defenders<input id="def" type="number" min="0" value="0"></label></div><button id="start" class="primary" style="width:100%;margin-top:14px">Start Game</button></div><p id="lerr" class="small"></p></div></section>
<section id="game" class="screen"><div class="hud"><b id="role">CREWMATE</b><div class="bar"><i id="fill"></i></div><span id="prog">0/0</span></div><canvas id="cv" width="960" height="540"></canvas><div class="bottom"><div id="joy" class="joy"><div id="stick" class="stick"></div></div><div class="actions"><button id="task">DO TASK</button><button id="kill" class="red hide">KILL</button><button id="meet" class="red">EMERGENCY</button></div></div><p id="status" class="small" style="max-width:1100px;margin:8px auto">Connected.</p></section>
<div id="reveal" class="overlay hide"><div style="text-align:center"><canvas id="rc" width="180" height="180" style="border:0"></canvas><h1 id="rr"></h1><p id="rt" class="small"></p></div></div>
<div id="taskModal" class="overlay hide"><div class="modal"><button id="taskClose" style="float:right">✕</button><h2 id="taskTitle">TASK</h2><div id="timer" class="code" style="font-size:20px"></div><div id="taskBody"></div><p id="taskMsg" class="small"></p></div></div>
<div id="meeting" class="overlay hide"><div class="modal"><h2>MEETING</h2><p id="reason"></p><div id="mtimer" class="code" style="font-size:20px"></div><div id="vstatus" class="small"></div><div id="votes" class="votes"></div><button id="skip" style="width:100%;margin-top:8px">Skip</button><div id="vmsg" style="margin-top:10px"></div></div></div>
<div id="victory" class="overlay hide"><div style="text-align:center"><h1 id="vtitle"></h1><p id="vtext"></p></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=s=>document.querySelector(s),screens=['name','menu','lobby','game'];const S={name:'Player',room:null,id:null,host:false,role:null,players:new Map(),x:1450,y:760,color:'#d94b50',hat:'none',pet:'none',dead:false,taskDone:0,totalTasks:0,judgeUsed:false,meeting:null};
function show(x){screens.forEach(s=>$('#'+s).classList.toggle('on',s===x))}socket.on('connect',()=>S.id=socket.id);socket.on('errorMsg',m=>{$('#err').textContent=m;$('#lerr').textContent=m});
$('#cont').onclick=()=>{S.name=$('#nameIn').value.trim()||'Player';show('menu')};$('#join').onclick=()=>$('#joinBox').classList.toggle('hide');function profile(){return{name:S.name,color:$('#color')?.value||S.color,hat:$('#hat')?.value||S.hat,pet:$('#pet')?.value||S.pet}}
$('#host').onclick=()=>{S.host=true;socket.emit('host',profile())};$('#joinGo').onclick=()=>{S.host=false;socket.emit('join',{...profile(),code:$('#roomIn').value.trim().toUpperCase()})};
socket.on('room',r=>{S.room=r.code;S.players=new Map(r.players.map(p=>[p.id,p]));const me=S.players.get(S.id);if(me){S.x=me.x;S.y=me.y;S.dead=!me.alive;S.taskDone=me.done||0}$('#roomCode').textContent=r.code;$('#players').innerHTML=r.players.map(p=>`<div class="player"><b>${esc(p.name)}</b>${p.id===r.host?' · HOST':''}${p.alive===false?' · GHOST':''}</div>`).join('');S.host=r.host===S.id;$('#hostSettings').classList.toggle('hide',!S.host);if(!r.started&&!$('#victory').classList.contains('hide'))return;if(!r.started)show('lobby');draw(performance.now())});
function settings(){return{difficulty:$('#diff').value,voteTime:+$('#voteTime').value,impostors:+$('#imps').value,engineers:+$('#eng').value,scientists:+$('#sci').value,judges:+$('#jud').value,defenders:+$('#def').value}};['diff','voteTime','imps','eng','sci','jud','def'].forEach(id=>$('#'+id).onchange=()=>S.host&&socket.emit('settings',settings()));$('#start').onclick=()=>socket.emit('start');
socket.on('role',d=>{S.role=d.role;S.judgeUsed=false});socket.on('started',d=>{S.dead=false;S.taskDone=0;S.totalTasks=[...S.players.values()].filter(p=>p.role!=='Impostor').length*7;$('#role').textContent=(S.role||'CREWMATE').toUpperCase();$('#kill').classList.toggle('hide',S.role!=='Impostor');show('game');$('#rr').textContent=S.role.toUpperCase();$('#rt').textContent=S.role==='Impostor'?'Blend in. Eliminate the crew.':'Complete your tasks and find the Impostor.';$('#reveal').classList.remove('hide');drawCrew($('#rc').getContext('2d'),90,100,S.color,S.hat,1.4);setTimeout(()=>$('#reveal').classList.add('hide'),2800)});
socket.on('moved',d=>{let p=S.players.get(d.id);if(p)Object.assign(p,d)});socket.on('killed',d=>{let p=S.players.get(d.id);if(p)p.alive=false;if(d.id===S.id){S.dead=true;$('#status').textContent='You are a ghost.'}});socket.on('taskProgress',d=>{let p=S.players.get(d.id);if(p)p.done=d.done;if(d.id===S.id)S.taskDone=d.done;S.totalTasks=d.total;progress()});
const C=$('#cv'),X=C.getContext('2d');let keys={},joy={x:0,y:0},last=0;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);const J=$('#joy'),ST=$('#stick');function jm(e){let r=J.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y),q=30;if(m>q){x=x/m*q;y=y/m*q}joy={x:x/q,y:y/q};ST.style.transform=`translate(${x}px,${y}px)`}J.onpointerdown=e=>{J.setPointerCapture(e.pointerId);jm(e)};J.onpointermove=e=>J.hasPointerCapture(e.pointerId)&&jm(e);J.onpointerup=()=>{joy={x:0,y:0};ST.style.transform=''};
function loop(t){if($('#game').classList.contains('on')&&$('#meeting').classList.contains('hide')&&$('#taskModal').classList.contains('hide')){let dt=Math.min(2,(t-last)/16.7||1),dx=joy.x+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),dy=joy.y+(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0),m=Math.hypot(dx,dy);if(m){S.x+=dx/m*4*dt;S.y+=dy/m*4*dt;S.x=Math.max(80,Math.min(3020,S.x));S.y=Math.max(80,Math.min(2020,S.y));socket.emit('move',{x:S.x,y:S.y,color:$('#color').value,hat:$('#hat').value,pet:$('#pet').value})}}last=t;draw(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function draw(t){X.clearRect(0,0,960,540);let camX=S.x-480,camY=S.y-270;X.save();X.translate(-camX,-camY);X.fillStyle='#101827';X.fillRect(80,80,2940,1940);X.strokeStyle='#31415a';X.lineWidth=8;for(let x=250;x<3000;x+=450){X.strokeRect(x,200+(x%3)*180,330,260)}X.fillStyle='#1b293b';X.fillRect(300,650,2450,180);X.fillRect(1300,300,180,1450);for(const p of S.players.values()){let x=p.id===S.id?S.x:p.x,y=p.id===S.id?S.y:p.y;if(p.alive!==false||S.dead){X.globalAlpha=p.alive===false?.38:1;drawCrew(X,x,y,p.color||'#777',p.hat||'none',1);drawPet(X,x-42,y+28,p.pet||'none',t);X.globalAlpha=1;X.fillStyle='#fff';X.font='bold 14px system-ui';X.textAlign='center';X.fillText(p.name,x,y-48)}}X.restore();nearButtons()}
function drawCrew(c,x,y,col,hat,sc){c.save();c.translate(x,y);c.scale(sc,sc);c.fillStyle=col;c.beginPath();c.roundRect(-25,-31,50,64,18);c.fill();c.fillStyle='#aee8f5';c.beginPath();c.roundRect(-9,-20,28,18,8);c.fill();c.fillStyle=col;c.fillRect(-31,-12,10,31);c.fillRect(-18,26,13,18);c.fillRect(7,26,13,18);drawHat(c,hat);c.restore()}
function drawHat(c,h){if(h==='none')return;c.save();if(h==='crown'){c.fillStyle='#e8c64a';c.beginPath();c.moveTo(-22,-31);c.lineTo(-18,-55);c.lineTo(-6,-42);c.lineTo(2,-60);c.lineTo(12,-42);c.lineTo(23,-55);c.lineTo(20,-30);c.closePath();c.fill()}else if(h==='tophat'){c.fillStyle='#20242d';c.fillRect(-25,-34,50,7);c.beginPath();c.roundRect(-16,-58,32,28,5);c.fill()}else if(h==='cap'){c.fillStyle='#4d77c7';c.beginPath();c.arc(0,-35,18,Math.PI,0);c.fill();c.fillRect(-2,-36,28,6)}else if(h==='cowboy'){c.fillStyle='#b8864e';c.beginPath();c.ellipse(0,-33,30,7,0,0,7);c.fill();c.beginPath();c.roundRect(-15,-52,30,20,8);c.fill()}else if(h==='beanie'){c.fillStyle='#a65aa6';c.beginPath();c.arc(0,-34,19,Math.PI,0);c.fill();c.beginPath();c.arc(0,-54,5,0,7);c.fill()}else if(h==='hardhat'){c.fillStyle='#e6b72e';c.beginPath();c.arc(0,-35,20,Math.PI,0);c.fill();c.fillRect(-25,-36,50,6)}else if(h==='wizard'){c.fillStyle='#6847a8';c.beginPath();c.moveTo(-20,-32);c.lineTo(4,-68);c.lineTo(18,-32);c.fill();c.fillRect(-25,-34,50,6)}else if(h==='sprout'){c.strokeStyle='#4c9b54';c.lineWidth=4;c.beginPath();c.moveTo(0,-31);c.lineTo(0,-52);c.stroke();c.fillStyle='#62b568';c.beginPath();c.ellipse(-7,-52,9,5,-.5,0,7);c.ellipse(7,-48,9,5,.5,0,7);c.fill()}c.restore()}
function drawPet(c,x,y,p,t){if(p==='none')return;let b=Math.sin(t/180)*2;c.save();c.translate(x,y+b);if(p==='robot'){c.fillStyle='#8794a6';c.fillRect(-11,-10,22,19);c.fillStyle='#7de2e8';c.fillRect(-6,-5,4,4);c.fillRect(3,-5,4,4);c.strokeStyle='#8794a6';c.beginPath();c.moveTo(0,-10);c.lineTo(0,-18);c.stroke()}else if(p==='blob'){c.fillStyle='#70b96f';c.beginPath();c.ellipse(0,0,15,12,0,0,7);c.fill();c.fillStyle='#111';c.fillRect(-6,-3,3,3);c.fillRect(4,-3,3,3)}else if(p==='chick'){c.fillStyle='#e8cf52';c.beginPath();c.arc(0,0,12,0,7);c.fill();c.fillStyle='#d88c35';c.beginPath();c.moveTo(10,0);c.lineTo(18,4);c.lineTo(10,7);c.fill()}else if(p==='buddy'){drawCrew(c,0,0,'#7d8ba0','none',.45)}else{c.fillStyle=p==='dog'?'#ad7c51':'#777';c.beginPath();c.ellipse(0,2,14,11,0,0,7);c.fill();c.beginPath();c.arc(9,-7,9,0,7);c.fill();if(p==='cat'){c.beginPath();c.moveTo(3,-13);c.lineTo(6,-23);c.lineTo(10,-14);c.moveTo(12,-14);c.lineTo(18,-22);c.lineTo(18,-10);c.fill()}}c.restore()}
function nearButtons(){let others=[...S.players.values()].filter(p=>p.id!==S.id&&p.alive!==false);let n=others.sort((a,b)=>Math.hypot(a.x-S.x,a.y-S.y)-Math.hypot(b.x-S.x,b.y-S.y))[0];$('#kill').disabled=!n||Math.hypot(n.x-S.x,n.y-S.y)>105||S.dead}
$('#kill').onclick=()=>{let n=[...S.players.values()].filter(p=>p.id!==S.id&&p.alive!==false).sort((a,b)=>Math.hypot(a.x-S.x,a.y-S.y)-Math.hypot(b.x-S.x,b.y-S.y))[0];if(n)socket.emit('kill',n.id)};$('#meet').onclick=()=>!S.dead&&socket.emit('meeting',{reason:S.name+' called an emergency meeting'});
let taskTimer=null;$('#task').onclick=()=>{if(S.role==='Impostor'||S.dead||S.taskDone>=7)return;openTask()};$('#taskClose').onclick=()=>{clearInterval(taskTimer);$('#taskModal').classList.add('hide')};function openTask(){const types=['CIRCUIT WIRING','DATA TRANSFER','VENT MAINTENANCE','TRASH SORTER','SIGNAL SEQUENCE'],type=types[Math.floor(Math.random()*types.length)],diff=$('#diff').value,limit={Easy:30,Medium:22,Hard:15,Insane:9}[diff],end=Date.now()+limit*1000;$('#taskTitle').textContent=type;$('#taskModal').classList.remove('hide');function build(){let count={Easy:4,Medium:5,Hard:6,Insane:8}[diff],seq=Array.from({length:count},(_,i)=>i);seq.sort(()=>Math.random()-.5);let step=0;$('#taskBody').innerHTML='<p>Tap the numbered modules in order. A mistake resets the whole task.</p><div class="votes" id="mods"></div>';seq.forEach(n=>{let b=document.createElement('button');b.textContent=n+1;b.onclick=()=>{if(n!==step){$('#taskMsg').textContent='Mistake — whole task reset.';return build()}b.disabled=true;if(++step===count){clearInterval(taskTimer);$('#taskModal').classList.add('hide');socket.emit('taskDone')}};$('#mods').appendChild(b)})}build();clearInterval(taskTimer);taskTimer=setInterval(()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));$('#timer').textContent='TIME '+left;if(!left){clearInterval(taskTimer);$('#taskMsg').textContent='Time up — whole task reset.';openTask()}},200)}
function progress(){let total=S.totalTasks||[...S.players.values()].length*7,done=[...S.players.values()].reduce((a,p)=>a+(p.done||0),0);$('#fill').style.width=(total?done/total*100:0)+'%';$('#prog').textContent=done+'/'+total}
socket.on('meeting',m=>{S.meeting=m;$('#meeting').classList.remove('hide');$('#reason').textContent=m.reason;$('#votes').innerHTML='';$('#vstatus').textContent='';$('#vmsg').textContent=S.role==='Judge'&&!S.judgeUsed?'Vote normally, or double-tap a player to use your one judgment.':'';m.players.forEach(p=>{if(p.id===S.id)return;let b=document.createElement('button');b.textContent=p.name;b.onclick=()=>vote(p.id);let lastTap=0;b.ontouchend=e=>{let now=Date.now();if(now-lastTap<330&&S.role==='Judge'&&!S.judgeUsed){e.preventDefault();S.judgeUsed=true;socket.emit('judge',p.id)}lastTap=now};b.ondblclick=()=>{if(S.role==='Judge'&&!S.judgeUsed){S.judgeUsed=true;socket.emit('judge',p.id)}};$('#votes').appendChild(b)});let iv=setInterval(()=>{if($('#meeting').classList.contains('hide'))return clearInterval(iv);$('#mtimer').textContent=Math.max(0,Math.ceil((m.ends-Date.now())/1000))+'s'},200)});function vote(id){socket.emit('vote',id);$('#votes').querySelectorAll('button').forEach(b=>b.disabled=true);$('#skip').disabled=true}$('#skip').onclick=()=>vote(null);socket.on('voted',d=>{$('#vstatus').textContent+=' ✓ '+(S.players.get(d.id)?.name||'Player')});socket.on('hammer',d=>{let h=document.createElement('div');h.className='hammer';h.textContent='🔨';h.style.left='50%';h.style.top='20%';document.body.appendChild(h);setTimeout(()=>h.remove(),800)});socket.on('judgeResult',d=>{$('#vmsg').textContent=d.text;if(d.dead===S.id)S.dead=true});socket.on('voteResult',d=>{$('#vmsg').innerHTML=d.votes.map(v=>`<b>${esc(v.voter)}</b> → ${esc(v.target)}`).join('<br>')+'<hr>'+(d.ejected?esc(d.ejected)+' was ejected.':'Nobody was ejected.');setTimeout(()=>$('#meeting').classList.add('hide'),2400)});socket.on('victory',d=>{$('#meeting').classList.add('hide');$('#victory').classList.remove('hide');$('#vtitle').textContent=d.title;$('#vtext').textContent=d.text;setTimeout(()=>{$('#victory').classList.add('hide');show('lobby')},3300)});function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
